apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notas-gcp
spec:
  replicas: 1 # 1 réplica es perfecta para probar y ahorrar costos
  selector:
    matchLabels:
      app: api-notas
  template:
    metadata:
      labels:
        app: api-notas
    spec:
      containers:
      - name: api-notas
        # ¡Ojo! Asegúrate de cambiar esto por la ruta de Artifact Registry que configuraste en tu Cloud Build
        image: us-central1-docker.pkg.dev/TU_PROYECTO_ID/mi-repo-python/app-python:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: api-notas-service-gcp
spec:
  selector:
    app: api-notas
  ports:
    - protocol: TCP
      port: 80       # El puerto por el que accederás en internet (http://tu-ip/)
      targetPort: 8080 # El puerto donde escucha tu contenedor de Python
  type: LoadBalancer # GCP te creará una IP pública automática