apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notas-gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-notas
  template:
    metadata:
      labels:
        app: api-notas
    spec:
      containers:
      - name: api-notas
        image: us-central1-docker.pkg.dev/TU_PROYECTO_ID/mi-repo-python/app-python:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: api-notas-service-gcp
spec:
  selector:
    app: api-notas
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer